[project]
name = "throng-city"
version = "0.1.0"
description = "A live, observable society of independently thinking LLM citizens."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "openai>=1.107.0",
    "pydantic>=2.11.0",
    "python-dotenv>=1.1.0",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
